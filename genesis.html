<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genesis Model Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101015;
        overflow: hidden;
        font-family: Georgia, serif;
      }

      #app {
        width: 100vw;
        height: 100vh;
      }

      .hud {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        color: #f3f4f7;
        background: rgba(16, 16, 22, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        padding: 10px 12px;
        letter-spacing: 0.04em;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="hud">Drag: rotate | Right-drag: pan | Scroll: zoom</div>
    <div id="app"></div>
    <script type="module" src="/src/genesis.js"></script>
  </body>
</html>
